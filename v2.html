<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>大肥鱼 · 战斗试作</title><link rel="stylesheet" href="./src/v2-preview.css"></head>
<body><main id="preview" class="preview-shell">
  <header class="topbar"><a class="brand" href="./index.html"><span class="brand-icon">◕</span><span>大肥鱼<small>拎上铁盆，出门试试手。</small></span></a><div class="top-actions"><span class="build-tag">战斗试作 02</span><button id="pause" type="button">暂停 <kbd>Esc</kbd></button></div></header>
  <section class="playfield" aria-label="大肥鱼战斗区域"><canvas id="sea" tabindex="0" aria-label="使用WASD移动，鼠标瞄准，按住左键射击"></canvas>
    <div id="hud" class="hud hidden"><div class="health"><div class="health-label"><span>大肥鱼</span><strong id="hp-label">100 / 100</strong></div><div class="health-track"><i id="hp-fill"></i></div></div><div class="counters"><span>大白饭 <b id="rice">0</b></span><span>附近海域 <b id="enemies">6</b> 只</span></div></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="controls" class="battle-controls hidden"><button id="switch" class="weapon" type="button"><small>当前 MCP · 点击切换 Q</small><strong id="weapon-label">泡泡接口</strong></button><div class="actions"><button id="checkpoint" type="button">保存检查点 <kbd>F</kbd></button><button id="skill" type="button">缓存护盾 <kbd>E</kbd><small id="skill-cd">就绪</small></button><button id="dash" type="button">冲刺 <kbd>Space</kbd><small id="dash-cd">就绪</small></button></div></div>
    <div id="left-stick" class="stick left" aria-label="移动摇杆"><span></span><small>移动</small></div><div id="right-stick" class="stick right" aria-label="瞄准射击摇杆"><span></span><small>瞄准 · 射击</small></div>
    <section id="menu" class="menu"><div class="menu-card"><span class="eyebrow">大肥鱼 V2 · 可操作试作</span><h1>今天也要<br>搞点大动静。</h1><p>带两把 MCP 出门，绕过礁石，躲开棕蟹的重钳，试试一发扇面能扫掉多少 Bot。</p><div class="setup"><label>地图种子<input id="seed" inputmode="numeric" type="number" min="0" max="4294967295" value="19"></label><label>主动技能<select id="skill-select"><option value="skill_cache">缓存护盾</option><option value="skill_disconnect">断开连接</option></select></label></div><button id="start" class="primary" type="button">拎盆出发 <span>→</span></button><button id="continue" class="secondary" type="button" disabled>继续上次检查点</button><p class="scope-note">当前仅开放战斗与检查点试作。大白饭可以拾取，升级插件、完整冒险、局外成长尚未接入。角色为临时像素稿，指定音乐待接入。</p></div></section>
    <section id="pause-menu" class="menu hidden"><div class="menu-card compact"><span class="eyebrow">喘口气也没关系</span><h1 id="pause-title">已暂停</h1><p id="pause-description">战斗时间已冻结。</p><button id="resume" class="primary" type="button">继续游</button><button id="restart" class="secondary" type="button">重新出发</button></div></section>
  </section><footer><span><kbd>WASD</kbd> 移动　鼠标瞄准 / 按住左键射击　<kbd>Q</kbd> 换 MCP　<kbd>E</kbd> 技能　<kbd>Space</kbd> 冲刺</span><span>电脑键鼠 / 手机双摇杆 · <a href="./index.html">返回旧版</a></span></footer>
</main><script type="module" src="./src/v2-preview.js"></script></body></html>
